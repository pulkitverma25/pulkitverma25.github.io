- title: Work Experience
  type: time_table
  contents:

    - title: 'Postdoctoral Associate <br ><a href="https://web.mit.edu/" target="_blank">Massachusetts Institute of Technology</a>.'
      year: 2024-(now)
      description:
        - 'Working in the <a href="https://interactive.mit.edu/" target="_blank">Interactive Robotics Group</a> at <a href="https://www.csail.mit.edu/" target="_blank">CSAIL</a> and <a href="https://aeroastro.mit.edu/" target="_blank">AeroAstro</a>, <a href="https://web.mit.edu/" target="_blank">MIT</a>.'

    - title: 'Graduate Research Associate <br ><a href="https://www.asu.edu/" target="_blank">Arizona State University</a>.'
      year: 2018-2024
      description:
        - 'Investigating the minimal set of interfaces in an AI system that would enable a user to assess and understand the limits of its safe operability.'
        - 'Developed a framework which generates interrogation policies to derive the human interpretable model of an autonomous agent.'
        - 'Reduced the STRIPS-model comparison to a planning problem which enabled identifying if two models are not same.'
        - 'Modified FF-planner to take PDDL models, initial state, plan as input, and give the final state as output.'
        - 'Co-designed the experiments showcasing possible use-case of an NSF project on training lay people to use adaptive AI systems which are safe, robust, and reliable.'

    - title: 'Research Scientist Intern - AI <br ><a href="https://www.meta.com/" target="_blank">Meta</a>.'
      year: 05-08 2023
      description:
        - 'Working on intersection of <a href="https://ai.facebook.com/" target="_blank">AI</a> and <a href="https://about.meta.com/realitylabs/" target="_blank">Reality Labs</a>.'
        - 'Developed a proof of concept system for curriculum personalization using sequential decision making.'

    - title: 'Storage Efficiency Developer <br ><a href="https://www.netapp.in/" target="_blank">NetApp Inc.</a>'
      year: 2015-2018
      description:
        - '<u>Workload Prediction</u>: Predicted workload on a storage volume based on I/O patterns for All Flash systems. This helped in optimizing data storage and management while keeping the nature of data private to the users.'
        - '<u>File and Volume Clones</u>: Developed features and managed issues related to file and volume clones on UNIX-based NetApp proprietary WAFL file system so as to improve the storage efficiency of enterprise data servers.'
        - 'Co-developed a file system component which prevented data loss if files and volumes are cloned or modified when cloud backup is offline.'

    - title: 'iOS Applications Developer <br ><a href="https://www.tcs.com" target="_blank">Tata Consultancy Services Ltd.</a>'
      year: 2012-2013
      description:
        - '<u>Portfolio Management Applications</u>:  Built applications for iPhone and iPad, and developed tools so as to analyze the user portfolio in an interactive way.'
        - '<u>Cross-platform Applications</u>: Cross-platform mobile application development of mobile applications supported on both Android and iOS.'

